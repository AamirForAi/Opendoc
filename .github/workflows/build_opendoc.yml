name: OpenDoc Automated Cloud Build

on:
  push:
    branches: [ "main", "master", "android" ]
  workflow_dispatch: # Isse aap manually bhi jab chahe button daba kar APK bana sakte hain

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Clone OpenDoc Repository Source
      uses: actions/checkout@v4

    - name: Set up Java Environment Runtime (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Compile and Build Standalone Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Extract and Upload Installable OpenDoc APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: OpenDoc-Installable-APK
        path: app/build/outputs/apk/debug/app-debug.apk
